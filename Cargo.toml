# Axiom — virtual workspace root.
#
# The root is intentionally a *virtual* workspace (no root package) so that
# `cargo check --workspace` / CI builds cleanly WITHOUT LLVM/MLIR or hvm-core
# installed. The MLIR and parallelism dependencies live in the `compiler`
# crate, feature-gated (--features mlir / --features parallel), and rmcp lives
# in `axiom-trace`. This keeps the default build turnkey for contributors.
[workspace]
members = ["compiler", "axiom-trace"]
resolver = "2"

# melior 0.14.0 as published on crates.io does NOT compile against its own
# melior-macro 0.8.1 (missing async_passes!/gpu_passes!/linalg_passes! macros)
# nor against the MLIR 18 C API (mlirLLVMPointerTypeGet signature + string_ref
# i8/u8). We vendor a patched copy (vendor/melior) with those modules disabled
# and the MLIR 18 API fixes applied, so CI builds the exact same source that
# works locally. See vendor/melior/README.md for the patch manifest.
[patch.crates-io]
melior = { path = "vendor/melior" }

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/slab1/axiom"

[profile.release]
opt-level = 3
lto = true
